# Insert prts-neuron: rewrites the Chat running-status row in the browser.
#
# The row (ui-chat's [data-chat-running]) shows a whale-tail icon and the copy
# "深度求索中，用时 …". This plugin replaces the icon with an animated GIF and
# the copy with "正在连接至PRTS神经元，用时 …", leaving ui-chat's sources
# untouched.
#
# The row's name is this package, so the Loader resolves both halves from the
# profile's node_modules: this host entry, and — because the package declares
# `dsh.client` — the browser half the client roster boots.
- insert:
    - id: prts-neuron
      name: '@huanlin/dsh-plugin-prts-neuron'
